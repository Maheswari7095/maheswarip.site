<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SEO Meta Extractor Tool</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f5f5f5;
      padding:20px;
      margin:0;
    }

    .container{
      max-width:1200px;
      margin:auto;
      background:#fff;
      padding:25px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      margin-bottom:20px;
      color:#333;
    }

    textarea{
      width:100%;
      height:180px;
      border:1px solid #ccc;
      border-radius:5px;
      padding:10px;
      font-size:14px;
      resize:vertical;
    }

    button{
      background:#007bff;
      color:white;
      border:none;
      padding:12px 20px;
      border-radius:5px;
      cursor:pointer;
      margin-top:15px;
      margin-right:10px;
      font-size:15px;
    }

    button:hover{
      background:#0056b3;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:25px;
      overflow-x:auto;
      display:block;
    }

    th, td{
      border:1px solid #ddd;
      padding:10px;
      font-size:13px;
      text-align:left;
    }

    th{
      background:#007bff;
      color:white;
      position:sticky;
      top:0;
    }

    tr:nth-child(even){
      background:#f9f9f9;
    }

    .note{
      margin-top:10px;
      color:#666;
      font-size:13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SEO Meta Extractor Tool</h1>

  <label><strong>Enter URLs (One URL Per Line)</strong></label>

  <textarea id="urlInput" placeholder="https://example.com"></textarea>

  <br>

  <button onclick="extractMeta()">Extract Meta Data</button>

  <button onclick="downloadCSV()">Download CSV</button>

  <div class="note">
    Note: Due to browser security (CORS), some websites may block extraction in Chrome.
  </div>

  <table id="resultTable">

    <thead>
      <tr>
        <th>URL</th>
        <th>Title</th>
        <th>Meta Description</th>
        <th>Canonical</th>
        <th>Robots</th>
        <th>H1</th>
        <th>H2 Count</th>
      </tr>
    </thead>

    <tbody></tbody>

  </table>

</div>

<script>

let tableData = [];

async function extractMeta(){

  const urls = document
    .getElementById("urlInput")
    .value
    .split("\n")
    .filter(url => url.trim() !== "");

  const tbody = document.querySelector("#resultTable tbody");

  tbody.innerHTML = "";

  tableData = [];

  for(const url of urls){

    try{

      const proxy = "https://api.allorigins.win/raw?url=";
      const response = await fetch(proxy + encodeURIComponent(url));

      const html = await response.text();

      const parser = new DOMParser();

      const doc = parser.parseFromString(html, "text/html");

      const title =
        doc.querySelector("title")?.innerText || "";

      const description =
        doc.querySelector('meta[name="description"]')
        ?.getAttribute("content") || "";

      const canonical =
        doc.querySelector('link[rel="canonical"]')
        ?.getAttribute("href") || "";

      const robots =
        doc.querySelector('meta[name="robots"]')
        ?.getAttribute("content") || "";

      const h1 =
        doc.querySelector("h1")?.innerText || "";

      const h2Count =
        doc.querySelectorAll("h2").length;

      const row = `
        <tr>
          <td>${url}</td>
          <td>${title}</td>
          <td>${description}</td>
          <td>${canonical}</td>
          <td>${robots}</td>
          <td>${h1}</td>
          <td>${h2Count}</td>
        </tr>
      `;

      tbody.innerHTML += row;

      tableData.push({
        URL: url,
        Title: title,
        Description: description,
        Canonical: canonical,
        Robots: robots,
        H1: h1,
        H2_Count: h2Count
      });

    }catch(error){

      const row = `
        <tr>
          <td>${url}</td>
          <td colspan="6">Error Fetching Data</td>
        </tr>
      `;

      tbody.innerHTML += row;
    }
  }
}

function downloadCSV(){

  if(tableData.length === 0){
    alert("No Data Available");
    return;
  }

  const headers = Object.keys(tableData[0]);

  let csv = headers.join(",") + "\n";

  tableData.forEach(row => {

    const values = headers.map(header =>
      `"${String(row[header]).replace(/"/g, '""')}"`
    );

    csv += values.join(",") + "\n";
  });

  const blob = new Blob([csv], { type: "text/csv" });

  const link = document.createElement("a");

  link.href = URL.createObjectURL(blob);

  link.download = "seo_meta_output.csv";

  link.click();
}

</script>

</body>
</html>
